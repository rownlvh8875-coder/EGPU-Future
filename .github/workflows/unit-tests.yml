name: unit-tests

on:
  push:
    branches: [main, dev-shadow-pairing-carrot-analysis]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run pure-Python tests
        run: pytest -q tests/test_recovery_state_machine.py tests/test_frame_pairing.py tests/test_output_validator.py
