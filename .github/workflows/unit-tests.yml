name: unit-tests

on:
  push:
    branches: [main, "dev-*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Compile Python sources
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m compileall -q egpu_future tools integrations
      - name: Run pure-Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests
